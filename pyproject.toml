[project]
name = "vaccinepath"
version = "0.1.0"
description = "VaccinePath Family SG — 规则引擎、数据模型与 agent 工具（NTU CA6117）"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "python-dateutil>=2.9",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vaccinepath"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
