[project]
name = "vaccinepath"
version = "0.1.0"
description = "VaccinePath Family SG — 规则引擎、数据模型与 agent 工具（NTU CA6117）"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "python-dateutil>=2.9",
    "langchain-core>=0.3",
    "streamlit>=1.64.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]
e2e = ["playwright>=1.50"]  # 真浏览器联调用（本机 Chrome）：uv sync --group e2e

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vaccinepath"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
